name: Build Binaries

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: pltd-linux-amd64
            build_tags: purego
          - goos: darwin
            goarch: amd64
            artifact: pltd-darwin-amd64
            build_tags: purego
          - goos: windows
            goarch: amd64
            artifact: pltd-windows-amd64.exe
            build_tags: purego

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: |
          mkdir -p dist
          export CGO_ENABLED=0
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          export SONIC_GO_PURE=1
          go build -tags "purego" -o dist/${{ matrix.artifact }} ./cmd/pltd/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
